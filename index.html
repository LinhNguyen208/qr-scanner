<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #reader {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        .result-value {
            margin-top: 10px;
            padding: 12px;
            background: #eee;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR Scanner</h1>
    <div>Chọn máy</div>
    <label><span>Máy 1</span><input type="radio" name="pos" value="1"></label>
    <label><span>Máy 2</span><input type="radio" name="pos" value="2"></label>
    <label><span>Máy 3</span><input type="radio" name="pos" value="3"></label>
    <label><span>Máy 4</span><input type="radio" name="pos" value="4"></label>
    <div id="reader"></div>

    <div class="result">
        <strong>Kết quả:</strong>

        <div id="result" class="result-value">
            Chưa quét
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzK1NB3Qjpr-TZ70sAGeCk6oHvN3D11ES045sn6SP8cvMsQsZ98fqL8rrWLaJAEVR3c/exec";

    function onScanSuccess(decodedText, decodedResult) {

        console.log("QR:", decodedText);
        // document.getElementById("result").innerText = decodedText;

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
              code: decodedText,
              pos: "3",
          })
    })
.then(response => response.json())
.then(result => {
  console.log(result);
});

    }

    function onScanFailure(error) {
        // Không cần xử lý liên tục
    }

    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );

    scanner.render(
        onScanSuccess,
        onScanFailure
    );


</script>

</body>
</html>
