<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzK1NB3Qjpr-TZ70sAGeCk6oHvN3D11ES045sn6SP8cvMsQsZ98fqL8rrWLaJAEVR3c/exec";

    // Đang xử lý API
    let isProcessing = false;

    // Danh sách mã đã gửi thành công
    const scannedCodes = new Set();

    async function onScanSuccess(decodedText, decodedResult) {

        console.log("QR:", decodedText);

        // Đang xử lý → bỏ qua
        if (isProcessing) {
            console.log("Đang xử lý, bỏ qua scan");
            return;
        }

        // Mã đã gửi trước đó → bỏ qua
        if (scannedCodes.has(decodedText)) {
            console.log("Mã đã tồn tại, không gửi:", decodedText);

            document.getElementById("result").innerText =
                "Mã đã quét trước đó: " + decodedText;

            return;
        }

        // Khóa scan
        isProcessing = true;

        // Tạm dừng scanner
        scanner.pause(true);

        // Hiển thị mã
        document.getElementById("result").innerText =
            "Đang xử lý: " + decodedText;

        try {

            // Lấy máy đang được chọn
            const selectedPos = document.querySelector(
                '.pos:checked'
            );

            if (!selectedPos) {
                throw new Error("Chưa chọn máy");
            }

            const POS = selectedPos.value;

            console.log("Máy:", POS);
            console.log("Mã:", decodedText);

            // Gửi API
            const response = await fetch(API_URL, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    code: decodedText,
                    pos: POS
                })
            });

            // Kiểm tra HTTP
            if (!response.ok) {
                throw new Error(
                    "HTTP Error: " + response.status
                );
            }

            const result = await response.json();

            console.log("API response:", result);

            if (result.success) {

                // Chỉ lưu mã khi API thành công
                scannedCodes.add(decodedText);

                document.getElementById("result").innerText =
                    "✓ Đã gửi thành công\n" +
                    "Mã: " + decodedText +
                    "\nMáy: " + POS;

            } else {

                document.getElementById("result").innerText =
                    "✗ API lỗi: " +
                    (result.message || "Không xác định");
            }

        } catch (error) {

            console.error("Lỗi:", error);

            document.getElementById("result").innerText =
                "✗ Lỗi gửi dữ liệu: " + error.message;

        } finally {

            // Mở khóa
            isProcessing = false;

            // Cho phép scan lại
            scanner.resume();
        }
    }


    function onScanFailure(error) {
        // Không cần xử lý
    }


    // Khởi tạo scanner
    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );


    // Bắt đầu scanner
    scanner.render(
        onScanSuccess,
        onScanFailure
    );
</script>
