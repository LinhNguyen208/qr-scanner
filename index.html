<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #reader {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        .result-value {
            margin-top: 10px;
            padding: 12px;
            background: #eee;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR Scanner</h1>
    <div id="reader"></div>

    <div class="result">
        <strong>Kết quả:</strong>

        <div id="result" class="result-value">
            Chưa quét
        </div>
    </div>
<div>Chọn máy</div>
    <label><span>Máy 1</span><input class="pos" type="radio" name="pos" value="1" checked></label>
    <label><span>Máy 2</span><input class="pos" type="radio" name="pos" value="2"></label>
    <label><span>Máy 3</span><input class="pos" type="radio" name="pos" value="3"></label>
    <label><span>Máy 4</span><input class="pos" type="radio" name="pos" value="4"></label>
    
</div>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw91P1ByLTvE83alkV42zD6a_kp200oGniHQTAmv-P1gd-UcNUJZfIzkQYlu0D_0_h0Bw/exec";

    // Đang xử lý API
    let isProcessing = false;

    // Danh sách mã đã gửi thành công
    const scannedCodes = new Set();

    async function onScanSuccess(decodedText, decodedResult) {

        console.log("QR:", decodedText);
        const isProcessing = true;
        scanner.pause(true);

        // Hiển thị mã
        document.getElementById("result").innerText =
            "Đang xử lý: " + decodedText;

        try {

            // Lấy máy đang được chọn
            const selectedPos = document.querySelector(
                '.pos:checked'
            );

            if (!selectedPos) {
                throw new Error("Chưa chọn máy");
            }

            const POS = selectedPos.value;

            console.log("Máy:", POS);
            console.log("Mã:", decodedText);

            // Gửi API
            const response = await fetch(API_URL, {
                method: "POST",

                body: JSON.stringify({
                    code: decodedText,
                    pos: POS
                })
            });

            // Kiểm tra HTTP
            if (!response.ok) {
                throw new Error(
                    "HTTP Error: " + response.status
                );
            }

            const result = await response.json();

            console.log("API response:", result);

            if (result.success) {

                // Chỉ lưu mã khi API thành công
                scannedCodes.add(decodedText);

                document.getElementById("result").innerText =
                    "✓ Đã gửi thành công\n" +
                    "Mã: " + decodedText +
                    "\nMáy: " + POS;

            } else {

                document.getElementById("result").innerText =
                    "✗ API lỗi: " +
                    (result.message || "Không xác định");
            }

        } catch (error) {

            console.error("Lỗi:", error);

            document.getElementById("result").innerText =
                "✗ Lỗi gửi dữ liệu: " + error.message;

        } finally {

            // Mở khóa
            isProcessing = false;

            // Cho phép scan lại
            scanner.resume();
        }
    }


    function onScanFailure(error) {
        // Không cần xử lý
    }


    // Khởi tạo scanner
    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );


    // Bắt đầu scanner
    scanner.render(
        onScanSuccess,
        onScanFailure
    );
</script>

</body>
</html>
